paths:
  preview_root: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/output/eval/nuplanhard1000/bevbase_merged1000

  shared_box_root: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/output/eval/nuplanhard1000/shared_box_preview_paired_200/box_projection

  sam3_repo: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/sam3-eval/sam3-eval/sam3

  checkpoint: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/ckpt/sam3.1/sam3.1_multiplex.pt

  output_dir: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/output/eval/nuplanhard1000/sam3_nuplanhard1000_box3d/bevbase


preview:
  # bevbase 已经 merge1000，只读这一份，不重新合并
  manifest_glob: 'stflow_manifest.jsonl'

  # 前3帧是复制的 real reference，不进入生成图测评
  skip_reference_frames: true

  strict_paths: true
  include_methods: []
  exclude_methods: []


shared_box:
  # 直接扫描公共 GT 的 rank_00~rank_03
  manifest_glob: '**/box_manifest.jsonl'

  strict_paths: true
  strict_match: true


sources:
  generated:
    type: preview_generated
    group_by_manifest: true


model:
  version: sam3.1

  prompts:
    - car
    - truck
    - bus

  confidence_threshold: 0.25

  batch_size: 1
  loader_workers: 4

  precision: bfloat16
  input_resolution: 1008

  save_masks: true
  mask_resolution: 256
  mask_threshold: 0.5

  max_detections_per_prompt: 100
  max_detections_per_image: 150
  nms_iou_threshold: 0.7

  checkpoint_minimum_coverage: 0.95
  checkpoint_mmap: true


box_projection:
  vehicle_colors_rgb:
    - [0, 0, 255]

  color_tolerance: 100
  min_brightness: 20
  close_kernel: 1
  min_line_pixels: 16
  min_bbox_width: 5
  min_bbox_height: 5
  min_hull_area: 36


annotation:
  classes:
    - CAR
    - TRUCK
    - BUS

  near_plane: 0.1
  min_projected_height_px: 8.0
  min_projected_area_px: 64.0
  min_in_frame_fraction: 0.1


visibility:
  min_gt_visible_ratio: 0.0
  min_gt_visible_connected_pixels: 4

  # 公共 3D box 是 amodal cuboid
  disable_gt_occlusion: true


matching:
  min_mask_iou: 0.05

  max_center_error_norm: 0.8
  max_scale_error_log: 1.2
  max_cost: 1.1

  cost_mask_iou: 0.65
  cost_center: 0.2
  cost_bottom: 0.05
  cost_scale: 0.1

  allow_bbox_mask_fallback: false

  # 绝对不要再用 GT-dependent 动态阈值
  min_sam_connected_pixels: 0


visualization:
  enabled: true

  # 每个 source 只保存前32张，避免大量可视化占空间
  max_frames_per_source: 32

  image_quality: 92
  mask_alpha: 0.25

  draw_cuboid: true
  draw_detection_box: true
  draw_filtered_small_sam: true


runtime:
  seed: 3407
  backend: sam3.1

  # 1000个 video 全部测，不限制 image 数
  limit_frames: 0

  overwrite: true
