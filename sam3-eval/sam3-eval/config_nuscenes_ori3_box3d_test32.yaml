paths:
  preview_root: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/output/eval/nuscenesablation/nuscenesablationori3_merged500
  shared_box_root: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/output/eval/nuscenesablation/nuscenesablationori3_box/box_projection

  sam3_repo: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/sam3-eval/sam3-eval/sam3

  checkpoint: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/ckpt/sam3.1/sam3.1_multiplex.pt

  output_dir: /inspire/qb-ilm/project/advanced-machine-learning/yanjunchi-24040/camsim_lyh/output/eval/nuscenesablation/sam3_nuscenes_ori3_box3d_test32


preview:
  # 已经 merged 了，所以这里只读这一份 manifest
  manifest_glob: 'stflow_manifest.jsonl'

  # 不测前3帧 GT reference，只测真正生成帧
  skip_reference_frames: true

  strict_paths: true
  include_methods: []
  exclude_methods: []


shared_box:
  # 不需要手动合并 rank_00~03
  # SAM 会递归把4个 rank 的 box_manifest 全读进来
  manifest_glob: '**/box_manifest.jsonl'

  strict_paths: true
  strict_match: true


sources:
  generated:
    type: preview_generated
    group_by_manifest: true


model:
  version: sam3.1

  prompts:
    - car
    - truck
    - bus

  confidence_threshold: 0.25

  batch_size: 1
  loader_workers: 0

  precision: bfloat16
  input_resolution: 1008

  save_masks: true
  mask_resolution: 256
  mask_threshold: 0.5

  max_detections_per_prompt: 100
  max_detections_per_image: 150
  nms_iou_threshold: 0.7

  checkpoint_minimum_coverage: 0.95
  checkpoint_mmap: true


box_projection:
  vehicle_colors_rgb:
    - [0, 0, 255]

  color_tolerance: 100
  min_brightness: 20
  close_kernel: 1
  min_line_pixels: 16
  min_bbox_width: 5
  min_bbox_height: 5
  min_hull_area: 36


annotation:
  classes:
    - CAR
    - TRUCK
    - BUS

  near_plane: 0.1
  min_projected_height_px: 8.0
  min_projected_area_px: 64.0
  min_in_frame_fraction: 0.1


visibility:
  disable_gt_occlusion: true

  min_gt_visible_ratio: 0.0
  min_gt_visible_connected_pixels: 4


matching:
  min_mask_iou: 0.05

  max_center_error_norm: 0.8
  max_scale_error_log: 1.2
  max_cost: 1.1

  cost_mask_iou: 0.65
  cost_center: 0.2
  cost_bottom: 0.05
  cost_scale: 0.1

  allow_bbox_mask_fallback: false

  # 固定，不能再使用 GT 动态阈值
  min_sam_connected_pixels: 0


visualization:
  enabled: true

  # 32张全部保存，方便检查3D box投影
  max_frames_per_source: 32

  image_quality: 95
  mask_alpha: 0.25

  draw_cuboid: true
  draw_detection_box: true
  draw_filtered_small_sam: true


runtime:
  seed: 3407
  backend: sam3.1

  # 注意：这里是32张 image/view，不是32个video
  limit_frames: 32

  overwrite: true
